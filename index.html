<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />
    <title>扫二维码</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app" id="app">
      <video id="video" class="video" playsinline muted autoplay></video>

      <header class="topbar">
        <p class="topbar__stat">已收货：<span id="count">0</span>包</p>
        <p class="topbar__stat">当前包装号：<span id="current-code"></span></p>
      </header>

      <p class="hint" id="status" data-tone="info" role="status" aria-live="polite">请将二维码置于取景框内扫描</p>

      <div class="frame-wrap">
        <div class="viewfinder" id="frame">
          <span class="corner corner--tl"></span>
          <span class="corner corner--tr"></span>
          <span class="corner corner--bl"></span>
          <span class="corner corner--br"></span>
          <span class="laser"></span>
        </div>
      </div>

      <div class="spacer"></div>

      <footer class="actions">
        <button class="action" id="end" type="button">
          <span class="action__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6 L18 18 M18 6 L6 18" />
            </svg>
          </span>
          <span class="action__label">结束扫描</span>
        </button>
        <button class="action" id="torch" type="button" aria-pressed="false" hidden disabled>
          <span class="action__icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="2.5" width="6" height="3.4" rx="0.8" />
              <path d="M9.8 5.9h4.4V21H9.8z" />
              <path d="M10.6 11.4h2.8" />
            </svg>
          </span>
          <span class="action__label">手电筒</span>
        </button>
      </footer>

      <aside class="debug" id="debug" hidden>
        <div class="debug__head">
          <span>调试面板</span>
          <button class="debug__close" id="debug-close" type="button" aria-label="关闭调试面板">×</button>
        </div>
        <dl class="debug__grid">
          <dt>识码引擎</dt>
          <dd id="dbg-engine">—</dd>
          <dt>原始结果</dt>
          <dd id="dbg-raw">—</dd>
          <dt>解码耗时</dt>
          <dd id="dbg-duration">—</dd>
          <dt>同码判定</dt>
          <dd id="dbg-dedupe">—</dd>
          <dt>宿主消息</dt>
          <dd id="dbg-message">—</dd>
          <dt>运行模式</dt>
          <dd id="dbg-mode">—</dd>
          <dt>参数</dt>
          <dd id="dbg-config">—</dd>
        </dl>
      </aside>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay__card">
          <h2 class="overlay__title" id="overlay-title">已结束扫描</h2>
          <p class="overlay__text" id="overlay-text">相机已停止。</p>
          <button class="overlay__btn" id="restart" type="button">重新开始</button>
        </div>
      </div>
    </main>

    <script src="https://appx/web-view.min.js"></script>
    <script src="./vendor/zxing.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
